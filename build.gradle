plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.3' // 안정적인 최신 3.x 버전으로 변경
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 스프링 부트 3.x 기준 라이브러리 구성
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web' // starter-webmvc 대신 표준 웹 라이브러리 사용
	
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2' // H2 데이터베이스 활성화
	annotationProcessor 'org.projectlombok:lombok'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test' // 통합 테스트 라이브러리
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
